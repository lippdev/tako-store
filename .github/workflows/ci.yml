name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Arquivos obrigatórios, frontmatter dos skills e o que o app gera a partir do design system.
      - name: Conferências do repositório
        run: node scripts/check.mjs

      - name: Instalar
        working-directory: web
        run: npm ci

      - name: Tipo
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
